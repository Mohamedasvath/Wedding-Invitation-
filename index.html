<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Nikkah Invitation ·</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Great+Vibes&family=Noto+Serif+Tamil:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cr: #f6ecdc;
            --cr2: #efe0c8;
            --go: #b8924a;
            --gl: #e6c97f;
            --br: #7b4a2c;
            --ink: #5a463c;
            --dk: #2a0f10;
            --la: 'Cormorant Garamond', Georgia, serif;
            --ta: 'Noto Serif Tamil', Georgia, serif;
            --sc: 'Great Vibes', cursive;
            --ar: 'Amiri', serif;
            box-sizing: border-box
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: #e6d6bd;
            color: var(--ink);
            font: 1.1rem/1.65 var(--la);
            -webkit-font-smoothing: antialiased
        }

        html[lang=ta] body {
            font: .92rem/1.95 var(--ta)
        }

        body.lock {
            overflow: hidden
        }

        .sheet {
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, var(--cr), var(--cr2) 50%, var(--cr))
        }

        @media(min-width:640px) {
            body {
                padding: 26px 0
            }

            .sheet {
                border-radius: 26px;
                box-shadow: 0 30px 80px -20px rgba(60, 30, 10, .4), 0 0 0 8px #fffaf0, 0 0 0 9px var(--go)
            }
        }

        .scr {
            position: relative;
            min-height: 100svh;
            padding: calc(70px + env(safe-area-inset-top, 0px)) 28px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .z {
            position: relative;
            z-index: 3;
            width: 100%
        }

        #bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, var(--gl), #d98d8d);
            transform-origin: 0 0;
            transform: scaleX(0);
            z-index: 70
        }

        .lang {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: 14px;
            z-index: 60;
            display: flex;
            padding: 3px;
            border-radius: 99px;
            background: rgba(42, 15, 16, .88);
            border: 1px solid var(--go)
        }

        .lang button {
            font: 600 .85rem var(--la);
            border: 0;
            background: none;
            color: var(--gl);
            padding: 5px 14px;
            border-radius: 99px;
            cursor: pointer
        }

        .lang button.on {
            background: var(--go);
            color: var(--dk)
        }

        /* frame */
        .frame {
            position: absolute;
            inset: 14px;
            border: 1.5px solid var(--go);
            border-radius: 150px 150px 10px 10px;
            pointer-events: none;
            z-index: 2
        }

        .frame::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: .5px solid rgba(184, 146, 74, .5);
            border-radius: 145px 145px 6px 6px
        }

        .fl {
            position: absolute;
            z-index: 1;
            width: var(--s, 190px);
            pointer-events: none;
            transform: scale(var(--fx, 1), var(--fy, 1))
        }

        .fl svg {
            width: 100%;
            height: auto;
            overflow: visible;
            transform-origin: 0 0;
            animation: sway 9s ease-in-out infinite alternate
        }

        .tl {
            top: -14px;
            left: -14px
        }

        .tr {
            top: -14px;
            right: -14px;
            --fx: -1
        }

        .bl {
            bottom: -14px;
            left: -14px;
            --fy: -1
        }

        .br2 {
            bottom: -14px;
            right: -14px;
            --fx: -1;
            --fy: -1
        }

        @keyframes sway {
            from {
                transform: rotate(-2.5deg)
            }

            to {
                transform: rotate(2.5deg)
            }
        }

        .lant {
            position: absolute;
            top: 0;
            right: 34px;
            width: 64px;
            z-index: 4;
            transform-origin: 50% 0;
            animation: swing 5s ease-in-out infinite alternate
        }

        @keyframes swing {
            from {
                transform: rotate(-5deg)
            }

            to {
                transform: rotate(5deg)
            }
        }

        /* cover */
        .cover {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px 36px;
            background: radial-gradient(circle at 50% 35%, #fff8ea, var(--cr2));
            transition: opacity 1.1s, transform 1.4s cubic-bezier(.7, 0, .2, 1), visibility 0s 1.4s;
            overflow: hidden
        }

        .cover.open {
            opacity: 0;
            transform: scale(1.25);
            visibility: hidden;
            pointer-events: none
        }

        .cover .in {
            position: relative;
            z-index: 3
        }

        .bis {
            font: 2rem/1.6 var(--ar);
            color: var(--br);
            margin: 0
        }

        .cap {
            letter-spacing: .2em;
            font-size: .8rem;
            text-transform: uppercase;
            margin: 6px 0 0
        }

        html[lang=ta] .cap {
            letter-spacing: 0;
            text-transform: none;
            font-size: .85rem
        }

        .nm {
            display: block;
            font: 400 4rem/1.05 var(--sc);
            color: var(--br)
        }

        html[lang=ta] .nm {
            font: 700 1.9rem/1.6 var(--ta)
        }

        .amp {
            display: block;
            font: italic 2.4rem/1 var(--la);
            color: var(--go);
            margin: 2px 0
        }

        .dline {
            margin: 14px auto 0;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            color: var(--go);
            max-width: 240px
        }

        .dline::before,
        .dline::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--go)
        }

        .dt {
            letter-spacing: .16em;
            font-size: .88rem;
            text-transform: uppercase;
            margin: 12px 0 0;
            color: var(--br)
        }

        html[lang=ta] .dt {
            letter-spacing: 0;
            text-transform: none
        }

        .open-b {
            margin-top: 26px;
            font: 600 .8rem var(--la);
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--br);
            background: rgba(255, 255, 255, .4);
            border: 1.5px solid var(--go);
            border-radius: 99px;
            padding: 13px 32px;
            cursor: pointer;
            animation: glow 2.6s ease-in-out infinite alternate
        }

        html[lang=ta] .open-b {
            letter-spacing: 0;
            text-transform: none;
            font: 600 .9rem var(--ta)
        }

        @keyframes glow {
            to {
                box-shadow: 0 0 26px rgba(184, 146, 74, .7)
            }
        }

        .cue {
            margin-top: 22px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--go);
            font-size: .82rem;
            text-decoration: none
        }

        .cue i {
            width: 1px;
            height: 30px;
            background: linear-gradient(var(--go), transparent);
            animation: drip 2s infinite
        }

        @keyframes drip {
            0% {
                transform: scaleY(0);
                transform-origin: top
            }

            50% {
                transform: scaleY(1);
                transform-origin: top
            }

            51% {
                transform-origin: bottom
            }

            100% {
                transform: scaleY(0);
                transform-origin: bottom
            }
        }

        /* text */
        .title {
            font: 600 1.65rem/1.4 var(--la);
            color: var(--br);
            margin: 8px 0
        }

        html[lang=ta] .title {
            font: 700 1.3rem/1.6 var(--ta)
        }

        .sal {
            color: var(--go);
            font-weight: 600;
            font-size: .9rem;
            margin: 0 0 10px
        }

        .lead {
            font-weight: 700;
            color: var(--br);
            margin: 0 0 4px
        }

        .body {
            margin: 0 auto 10px;
            max-width: 44ch
        }

        .big {
            font-weight: 700;
            color: var(--br);
            font-size: 1.2rem;
            margin: 6px 0
        }

        .sec {
            font: 2.6rem/1.2 var(--sc);
            color: var(--br);
            margin: 0 0 10px
        }

        html[lang=ta] .sec {
            font: 700 1.5rem/1.6 var(--ta)
        }

        .pn {
            font: italic 600 2rem/1.3 var(--la);
            color: var(--br);
            margin: 4px 0
        }

        html[lang=ta] .pn {
            font: 700 1.4rem/1.6 var(--ta)
        }

        .fam {
            font-size: .92rem;
            margin: 0 auto 4px;
            max-width: 36ch
        }

        .amp.s {
            font-size: 3rem;
            margin: 14px 0
        }

        .cal {
            max-width: 320px;
            margin: 6px auto 14px;
            padding: 16px 14px;
            border: 1.5px solid var(--go);
            border-radius: 110px 110px 12px 12px;
            background: rgba(255, 252, 246, .6)
        }

        .cal h3 {
            margin: 6px 0 8px;
            font: 600 1.3rem var(--la);
            letter-spacing: .2em;
            color: var(--br)
        }

        .gr {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px
        }

        .gr .w {
            font-size: .75rem;
            color: var(--go);
            font-weight: 700
        }

        .gr .d {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            opacity: .8
        }

        .gr .hit {
            position: relative;
            color: #fff;
            opacity: 1;
            font-weight: 700;
            z-index: 0
        }

        .gr .hit::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #c9a45c, #8a5a22);
            z-index: -1;
            animation: pulse 2s infinite
        }

        @keyframes pulse {
            50% {
                transform: scale(1.12)
            }
        }

        .count {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 12px
        }

        .count div {
            padding: 10px 2px 6px;
            border: 1px solid var(--go);
            border-radius: 40px 40px 6px 6px;
            background: rgba(255, 255, 255, .5)
        }

        .count b {
            display: block;
            font: 700 2rem/1.1 var(--la);
            color: var(--br);
            font-variant-numeric: tabular-nums
        }

        .count small {
            font-size: .72rem
        }

        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 14px
        }

        .btn {
            font: 600 .9rem var(--la);
            text-decoration: none;
            color: var(--cr);
            background: var(--br);
            padding: 10px 22px;
            border-radius: 99px;
            border: 1px solid var(--br)
        }

        .btn.alt {
            background: transparent;
            color: var(--br)
        }

        .tel {
            color: var(--go);
            font-weight: 700;
            letter-spacing: .06em;
            text-decoration: none
        }

        .hosts {
            display: grid;
            gap: 16px;
            margin-bottom: 10px
        }

        .hosts p {
            margin: 0
        }

        .lbl {
            font-size: .85rem;
            opacity: .8
        }

        .fm {
            font-weight: 600;
            color: var(--br)
        }

        .orn {
            display: block;
            width: 150px;
            height: 14px;
            margin: 16px auto
        }

        .thx {
            font: 1.7rem var(--ar);
            color: var(--br);
            margin: 18px 0 0
        }

        /* grand footer */
   .grand{position:relative;padding:96px 28px 0;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,var(--cr),var(--cr2) 60%,#e4cfa8)}
.grand .frame{inset:14px}
.grand>.z{position:relative;z-index:3}
.gm{width:54px;margin:0 auto 4px;filter:drop-shadow(0 0 8px rgba(184,146,74,.45));animation:swing 6s ease-in-out infinite alternate}
.gd{font:1.7rem var(--ar);color:var(--br);margin:0 0 6px}
.gn{font:400 3.4rem/1.1 var(--sc);color:var(--br);margin:0;display:block}
html[lang=ta] .gn{font:700 1.7rem/1.7 var(--ta)}
.grand .amp{font:italic 2.2rem/1 var(--la);color:var(--go);display:block;margin:2px 0}
.gdt{font-size:1rem;font-style:italic;letter-spacing:.05em;color:var(--br);margin:14px 0 6px}
html[lang=ta] .gdt{font-style:normal;letter-spacing:0}

.row{position:relative;z-index:3;overflow:hidden;margin:10px 20px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.trk{display:flex;width:max-content;animation:mq 28s linear infinite}
.row.rv .trk{animation-direction:reverse}
@keyframes mq{to{transform:translateX(-50%)}}
.chip{margin-right:12px;padding:9px 20px;border-radius:99px;white-space:nowrap;color:var(--br);
  border:1px solid var(--go);background:rgba(255,252,246,.6)}

.sp{position:absolute;inset:0;pointer-events:none}
.st{position:absolute;width:var(--w);height:var(--w);background:var(--go);opacity:.25;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  animation:tw var(--t) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{50%{opacity:.9;transform:scale(1.3) rotate(25deg)}}

.cr{position:relative;z-index:3;margin:40px -14px 0;padding:22px 24px calc(34px + env(safe-area-inset-bottom,0px))}
.cr small{display:block;font-size:.9rem;font-style:italic;color:var(--br)}
.cr strong{display:block;font:2.1rem var(--sc);color:var(--go)}
.cr span{font:600 .85rem var(--la);letter-spacing:.06em;color:var(--br)}
        /* motion */
        .js .r {
            opacity: 0;
            transform: translateY(26px);
            filter: blur(6px);
            transition: opacity 1s, transform 1.1s cubic-bezier(.2, .8, .2, 1), filter 1s
        }

        .js .r.in {
            opacity: 1;
            transform: none;
            filter: none
        }

        #pt {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            overflow: hidden
        }

        .pe {
            position: absolute;
            top: -30px;
            width: var(--w);
            height: calc(var(--w)*1.25);
            border-radius: 70% 0 70% 0;
            background: linear-gradient(135deg, #fff, #f0d6c8);
            opacity: .6;
            animation: fall var(--t) linear infinite;
            animation-delay: var(--dl)
        }

        @keyframes fall {
            0% {
                transform: translate3d(0, -5vh, 0) rotate(0)
            }

            50% {
                transform: translate3d(var(--x), 55vh, 0) rotate(200deg)
            }

            100% {
                transform: translate3d(calc(var(--x)*-.5), 110vh, 0) rotate(420deg)
            }
        }

        @media(max-width:380px) {
            .nm {
                font-size: 3.3rem
            }

            .scr {
                padding-left: 22px;
                padding-right: 22px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }

            .js .r {
                opacity: 1;
                transform: none;
                filter: none
            }
        }
    </style>
</head>

    <div id="bar"></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="en"
            class="on">English</button><button type="button" data-l="ta">தமிழ்</button></div>

    <div class="cover" id="cover">
        <div class="frame"></div>
        <span class="fl tl"><svg viewBox="0 0 220 220">
                <use href="#ca" />
            </svg></span><span class="fl bl"><svg viewBox="0 0 220 220">
                <use href="#ca" />
            </svg></span><span class="fl br2" style="--s:150px"><svg viewBox="0 0 220 220">
                <use href="#ca" />
            </svg></span>
        <svg class="lant" viewBox="0 0 80 190">
            <use href="#lt" />
        </svg>
        <div class="in">
            <p class="bis">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>

            <div class="dline">✦</div>

            <p class="dt" data-t="dd"></p><button id="open" type="button" class="open-b" data-t="c3"></button>

    <div id="pt" aria-hidden="true"></div>

    <main class="sheet">
        <section class="scr" id="top">
            <div class="frame"></div>
            <span class="fl tl"><svg viewBox="0 0 220 220">
                    <use href="#ca" />
                </svg></span><span class="fl bl"><svg viewBox="0 0 220 220">
                    <use href="#ca" />
                </svg></span><span class="fl br2" style="--s:150px"><svg viewBox="0 0 220 220">
                    <use href="#ca" />
                </svg></span>
            <svg class="lant" viewBox="0 0 80 190">
                <use href="#lt" />
